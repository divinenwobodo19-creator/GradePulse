# GradePulse — Docker Compose
# ============================
# Usage:
#   docker compose up -d              # start all services
#   docker compose up -d --build      # rebuild and start
#   docker compose logs -f api        # follow API logs
#   docker compose down               # stop all services
#
# First time:
#   cp .env.example .env              # create your .env
#   docker compose up -d --build
#
# Data persists in the `gradepulse-data` volume across restarts.

services:
  # ── FastAPI Backend ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: gradepulse-api
    restart: unless-stopped
    ports:
      # Local only: the public reaches the API through the web app's /api proxy.
      - "127.0.0.1:${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
      # No default secret: compose stops with this message until .env sets one.
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (python -c "import secrets; print(secrets.token_urlsafe(48))")}
      - GRADEPULSE_ENV=${GRADEPULSE_ENV:-production}
      - BRAIN_STATE_PATH=/data/brain_state.json
      - CONFIG_PATH=/data/class_config.json
      - USER_DB_PATH=/data/gradepulse_users.db
      - BACKUP_DIR=/data/backups
      - BACKUP_ENABLED=${BACKUP_ENABLED:-true}
      - OPERATOR_KEY=${OPERATOR_KEY:-}
      - RECOMMENDATIONS_ENABLED=${RECOMMENDATIONS_ENABLED:-false}
      - TRUST_FORWARDED_FOR=${TRUST_FORWARDED_FOR:-false}
      - TRUST_CF_CONNECTING_IP=${TRUST_CF_CONNECTING_IP:-false}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY:-}
      - PRICE_PER_STUDENT_NAIRA=${PRICE_PER_STUDENT_NAIRA:-}
      - TERM_DAYS=${TERM_DAYS:-120}
      - FREE_STUDENTS=${FREE_STUDENTS:-40}
      - GRACE_DAYS=${GRACE_DAYS:-14}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - gradepulse-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - gradepulse

  # ── Next.js Frontend ──────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        API_URL: http://api:8000
    container_name: gradepulse-web
    restart: unless-stopped
    ports:
      # Local only: put a TLS proxy or tunnel in front, or set WEB_BIND=0.0.0.0.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gradepulse

volumes:
  gradepulse-data:
    driver: local

networks:
  gradepulse:
    driver: bridge
